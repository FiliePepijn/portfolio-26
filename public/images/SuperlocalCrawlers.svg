<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#000000"/>
  
  <!-- Grid lines for texture -->
  <g stroke="#b6ff3a" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>

  <!-- Scattered small photo-like rectangles -->
  <g opacity="0.15">
    <rect x="150" y="180" width="80" height="60" fill="#b6ff3a" rx="2" transform="rotate(-12 190 210)"/>
    <rect x="380" y="320" width="60" height="80" fill="#b6ff3a" rx="2" transform="rotate(8 410 360)"/>
    <rect x="720" y="150" width="90" height="65" fill="#b6ff3a" rx="2" transform="rotate(-5 765 182)"/>
    <rect x="900" y="420" width="70" height="55" fill="#b6ff3a" rx="2" transform="rotate(15 935 447)"/>
    <rect x="550" y="550" width="85" height="60" fill="#b6ff3a" rx="2" transform="rotate(-8 592 580)"/>
    <rect x="250" y="520" width="55" height="75" fill="#b6ff3a" rx="2" transform="rotate(20 277 557)"/>
    <rect x="1020" y="220" width="65" height="50" fill="#b6ff3a" rx="2" transform="rotate(-3 1052 245)"/>
  </g>

  <!-- Abstract crawler shapes -->
  <g opacity="0.2" fill="none" stroke="#b6ff3a" stroke-width="2">
    <!-- Crawler 1 - segmented body -->
    <circle cx="300" cy="400" r="12"/>
    <circle cx="330" cy="395" r="10"/>
    <circle cx="355" cy="400" r="8"/>
    <circle cx="375" cy="408" r="7"/>
    <circle cx="392" cy="418" r="6"/>
    <line x1="280" y1="390" x2="265" y2="375"/>
    <line x1="280" y1="410" x2="265" y2="425"/>
    <line x1="330" y1="385" x2="325" y2="370"/>
    <line x1="355" y1="393" x2="350" y2="378"/>
    
    <!-- Crawler 2 -->
    <circle cx="800" cy="350" r="14"/>
    <circle cx="830" cy="355" r="11"/>
    <circle cx="855" cy="362" r="9"/>
    <circle cx="875" cy="372" r="7"/>
    <line x1="780" y1="340" x2="765" y2="325"/>
    <line x1="780" y1="360" x2="765" y2="375"/>
    <line x1="830" y1="345" x2="820" y2="330"/>
  </g>

  <!-- Title text -->
  <text x="600" y="370" text-anchor="middle" font-family="monospace, 'Courier New'" font-weight="bold" font-size="72" fill="#b6ff3a" letter-spacing="-2">SUPERLOCAL</text>
  <text x="600" y="430" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="28" fill="#b6ff3a" opacity="0.6">— Crawling Archive</text>
  
  <!-- Subtitle -->
  <text x="600" y="490" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="14" fill="#b6ff3a" opacity="0.35">Watch the archive become something else</text>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#b6ff3a" stroke-width="1" opacity="0.15" rx="0"/>
</svg>
